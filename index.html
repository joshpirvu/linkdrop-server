            toggleMemberPopover(membersEl); // The member count opens the list instead of the panel
            return;
        }
        setRoomPanelOpen(!roomHeader.classList.contains('panel-open'));
    });

    // Starting to type means the person wants the chat: collapse the panel out of the way.
    // One-way on purpose: re-expanding on blur would make the header flap when tapping Send.
    msgInput.addEventListener('focus', () => {
        if (phoneLayout.matches) setRoomPanelOpen(false);
    });

    // ===== Message features: timestamps, date separators, reactions, replies, delete =====
    const REACTION_EMOJIS = ['\uD83D\uDC4D', '\u2764\uFE0F', '\uD83D\uDE02', '\uD83D\uDE2E', '\uD83D\uDE22', '\uD83D\uDD25']; // 👍 ❤️ 😂 😮 😢 🔥 (must match server.js)
    const messagesWrap = document.querySelector('.messages-wrap');

    function formatTime(ts) {
        try {
            return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        } catch (e) {
            return '';
        }
    }

    function dateKey(ts) {
        return new Date(ts).toDateString();
    }

    function dateLabel(ts) {
        const d = new Date(ts);
        const now = new Date();
        if (d.toDateString() === now.toDateString()) return 'Today';
        const yesterday = new Date(now);
        yesterday.setDate(now.getDate() - 1);
        if (d.toDateString() === yesterday.toDateString()) return 'Yesterday';
        const opts = { weekday: 'long', day: 'numeric', month: 'long' };
        if (d.getFullYear() !== now.getFullYear()) opts.year = 'numeric';
        return d.toLocaleDateString(undefined, opts);
    }

    function makeDateDivider(ts) {
        const el = document.createElement('div');
        el.className = 'date-divider';
        el.textContent = dateLabel(ts);
        return el;
    }

    function addDateSeparatorIfNeeded(ts) {
        const key = dateKey(ts);
        if (key === lastDateKey) return;
        messagesDiv.appendChild(makeDateDivider(ts));
        lastDateKey = key;
    }

    // Recomputes every date divider from the messages actually in the chat (used after history is inserted)
    function rebuildDateSeparators() {
        messagesDiv.querySelectorAll('.date-divider').forEach((el) => el.remove());
        let key = null;
        messagesDiv.querySelectorAll('.message[data-ts]').forEach((el) => {
            const ts = Number(el.dataset.ts);
            const k = dateKey(ts);
            if (k === key) return;
            // Keep the "new messages" line directly above its message
            const before = (el.previousElementSibling && el.previousElementSibling.id === 'unreadDivider') ? el.previousElementSibling : el;
            messagesDiv.insertBefore(makeDateDivider(ts), before);
            key = k;
        });
        lastDateKey = key;
    }

    function normalizeReactions(raw) {
        const out = {};
        if (raw && typeof raw === 'object') {
            Object.keys(raw).forEach((emoji) => {
                if (REACTION_EMOJIS.includes(emoji) && Array.isArray(raw[emoji]) && raw[emoji].length) {
                    out[emoji] = raw[emoji].map(String);
                }
            });
        }
        return out;
    }

    // Turns whatever the server sent into a message object the renderer can trust
    function normalizeMessage(data) {
        const replyTo = data.replyTo && typeof data.replyTo === 'object' ? data.replyTo : null;
        return {
            id: typeof data.id === 'string' ? data.id : null,
            nick: typeof data.nick === 'string' ? data.nick : 'Anonymous',
            message: typeof data.message === 'string' ? data.message : '',
            image: isSafeImage(data.image) ? data.image : null,
            imageOmitted: !!data.imageOmitted,
            own: data.own === true,
            timestamp: typeof data.timestamp === 'number' ? data.timestamp : Date.now(),
            replyTo: replyTo ? { id: String(replyTo.id || ''), nick: String(replyTo.nick || ''), text: String(replyTo.text || '') } : null,
            reactions: normalizeReactions(data.reactions),
            mine: Array.isArray(data.mine) ? data.mine.filter((e) => typeof e === 'string') : [],
            deleted: false
        };
    }

    function renderReactions(div, msg) {
        let row = div.querySelector('.msg-reactions');
        const emojis = REACTION_EMOJIS.filter((emoji) => msg.reactions[emoji] && msg.reactions[emoji].length);
        if (!emojis.length) {
            if (row) row.remove();
            return;
        }
        if (!row) {
            row = document.createElement('div');
            row.className = 'msg-reactions';
            div.querySelector('.msg-body').appendChild(row);
        }
        row.innerHTML = '';
        emojis.forEach((emoji) => {
            const chip = document.createElement('button');
            chip.type = 'button';
            chip.className = 'reaction-chip' + (msg.mine.includes(emoji) ? ' mine' : '');
            chip.dataset.emoji = emoji;
            chip.textContent = `${emoji} ${msg.reactions[emoji].length}`;
            chip.title = msg.reactions[emoji].join(', ');
            row.appendChild(chip);
        });
    }

    function toggleReaction(messageId, emoji) {
        if (!currentRoomId || !REACTION_EMOJIS.includes(emoji)) return;
        socket.emit('react', { roomId: currentRoomId, messageId, emoji });
    }

    function jumpToMessage(id) {
        const entry = id ? messagesById.get(id) : null;
        if (!entry) return;
        entry.el.scrollIntoView({ block: 'center', behavior: 'smooth' });
        entry.el.classList.add('flash');
        setTimeout(() => entry.el.classList.remove('flash'), 1200);
    }

    // --- Selecting a message shows a small toolbar: react, reply, delete (own messages only) ---
    let selectedMessageId = null;
    let deleteArmed = false;

    function buildToolbar() {
        msgToolbar.innerHTML = '';
        REACTION_EMOJIS.forEach((emoji) => {
            const b = document.createElement('button');
            b.type = 'button';
            b.className = 'toolbar-emoji';
            b.dataset.emoji = emoji;
            b.textContent = emoji;
            b.title = 'React';
            msgToolbar.appendChild(b);
        });
        const reply = document.createElement('button');
        reply.type = 'button';
        reply.id = 'toolbarReplyBtn';
        reply.title = 'Reply';
        reply.setAttribute('aria-label', 'Reply');
        reply.innerHTML = '<i class="ph ph-arrow-bend-up-left"></i>';
        msgToolbar.appendChild(reply);
        const del = document.createElement('button');
        del.type = 'button';
        del.id = 'toolbarDeleteBtn';
        del.title = 'Delete';
        del.setAttribute('aria-label', 'Delete');
        del.innerHTML = '<i class="ph ph-trash"></i>';
        msgToolbar.appendChild(del);
    }
    buildToolbar();

    function selectMessage(id) {
        clearSelection();
        const entry = messagesById.get(id);
        if (!entry || entry.msg.deleted) return;
        selectedMessageId = id;
        entry.el.classList.add('selected');
        const del = document.getElementById('toolbarDeleteBtn');
        del.classList.toggle('hidden', !entry.msg.own);
        del.classList.remove('confirm');
        del.innerHTML = '<i class="ph ph-trash"></i>';
        deleteArmed = false;
        msgToolbar.querySelectorAll('.toolbar-emoji').forEach((b) => b.classList.toggle('active', entry.msg.mine.includes(b.dataset.emoji)));
        msgToolbar.classList.remove('hidden');
        messagesWrap.classList.add('has-selection');
    }

    function clearSelection() {
        if (selectedMessageId) {
            const entry = messagesById.get(selectedMessageId);
            if (entry) entry.el.classList.remove('selected');
        }
        selectedMessageId = null;
        deleteArmed = false;
        msgToolbar.classList.add('hidden');
        messagesWrap.classList.remove('has-selection');
    }

    messagesDiv.addEventListener('click', (e) => {
        const chip = e.target.closest('.reaction-chip');
        if (chip) {
            const bubble = chip.closest('.message');
            if (bubble && bubble.dataset.id) toggleReaction(bubble.dataset.id, chip.dataset.emoji);
            return;
        }
        const quote = e.target.closest('.msg-quote');
        if (quote) {
            jumpToMessage(quote.dataset.target);
            return;
        }
        if (e.target.closest('a, img, button')) return; // Links, images and buttons keep their own behaviour
        const bubble = e.target.closest('.message');
        if (!bubble || !bubble.dataset.id) return;
        if (window.getSelection && String(window.getSelection()).length) return; // Selecting text, not the message
        if (selectedMessageId === bubble.dataset.id) clearSelection();
        else selectMessage(bubble.dataset.id);
    });

    msgToolbar.addEventListener('click', (e) => {
        const btn = e.target.closest('button');
        if (!btn || !selectedMessageId) return;
        const id = selectedMessageId;
        if (btn.classList.contains('toolbar-emoji')) {
            toggleReaction(id, btn.dataset.emoji);
            clearSelection();
        } else if (btn.id === 'toolbarReplyBtn') {
            const entry = messagesById.get(id);
            clearSelection();
            if (entry) setPendingReply(entry.msg);
        } else if (btn.id === 'toolbarDeleteBtn') {
            if (!deleteArmed) {
                // First tap arms the button, the second one deletes
                deleteArmed = true;
                btn.classList.add('confirm');
                btn.innerHTML = '<i class="ph ph-trash"></i> Delete?';
                return;
            }
            socket.emit('delete_message', { roomId: currentRoomId, messageId: id });
            clearSelection();
        }
    });

    document.addEventListener('click', (e) => {
        if (selectedMessageId && !e.target.closest('.message, .msg-toolbar')) clearSelection();
        if (memberPopoverOpen && !e.target.closest('#memberPopover, .room-bar-members, .member-count-box')) closeMemberPopover();
    });

    // --- Replying: the quoted message is shown above the input until the reply is sent ---
    let pendingReply = null;

    function setPendingReply(msg) {
        if (!msg || !msg.id) return;
        pendingReply = {
            id: msg.id,
            nick: msg.own ? 'You' : msg.nick,
            text: msg.message || ((msg.image || msg.imageOmitted) ? '\uD83D\uDCF7 Photo' : '')
        };
        replyBarNick.textContent = pendingReply.nick;
        replyBarText.textContent = pendingReply.text;
        replyBar.classList.remove('hidden');
        msgInput.focus();
    }

    function clearPendingReply() {
        pendingReply = null;
        replyBar.classList.add('hidden');
    }

    cancelReplyBtn.addEventListener('click', () => {
        clearPendingReply();
        msgInput.focus();
    });

    // --- Typing indicator ---
    let typingActive = false;
    let typingStopTimer = null;
    const typingUsers = new Map(); // nick -> expiry timer

    function sendTyping(state) {
        if (!currentRoomId || typingActive === state) return;
        typingActive = state;
        socket.emit('typing', { roomId: currentRoomId, typing: state });
    }

    msgInput.addEventListener('input', () => {
        if (!currentRoomId) return;
        clearTimeout(typingStopTimer);
        if (msgInput.value.trim()) {
            sendTyping(true);
            typingStopTimer = setTimeout(() => sendTyping(false), 2500);
        } else {
            sendTyping(false);
        }
    });

    function renderTyping() {
        const names = Array.from(typingUsers.keys());
        if (!names.length) {
            typingIndicator.classList.remove('visible');
            typingIndicator.textContent = '';
            return;
        }
        let text;
        if (names.length === 1) text = `${names[0]} is typing`;
        else if (names.length === 2) text = `${names[0]} and ${names[1]} are typing`;
        else text = 'Several people are typing';
        typingIndicator.textContent = text;
        const dots = document.createElement('span');
        dots.className = 'typing-dots';
        dots.innerHTML = '<i></i><i></i><i></i>';
        typingIndicator.appendChild(dots);
        typingIndicator.classList.add('visible');
    }

    function clearTypingUsers() {
        for (const timer of typingUsers.values()) clearTimeout(timer);
        typingUsers.clear();
        renderTyping();
    }

    socket.on('typing', (data) => {
        if (!data || data.roomId !== currentRoomId || typeof data.nick !== 'string') return;
        const existing = typingUsers.get(data.nick);
        if (existing) clearTimeout(existing);
        if (data.typing) {
            // Expires on its own in case the "stopped typing" event never arrives
            typingUsers.set(data.nick, setTimeout(() => {
                typingUsers.delete(data.nick);
                renderTyping();
            }, 4000));
        } else {
            typingUsers.delete(data.nick);
        }
        renderTyping();
    });

    // --- Member list behind the member count ---
    let roomMembers = [];
    let memberPopoverOpen = false;

    socket.on('member_list', (data) => {
        if (!data || data.roomId !== currentRoomId || !Array.isArray(data.members)) return;
        roomMembers = data.members.filter((n) => typeof n === 'string');
        if (memberPopoverOpen) renderMemberPopover();
    });

    function renderMemberPopover() {
        memberPopover.innerHTML = '';
        const title = document.createElement('div');
        title.className = 'member-popover-title';
        title.textContent = `In this room (${roomMembers.length})`;
        memberPopover.appendChild(title);
        roomMembers.forEach((nick) => {
            const row = document.createElement('div');
            row.className = 'member-row';
            row.textContent = nick;
            if (nick === myNick) {
                const me = document.createElement('span');
                me.className = 'member-me';
                me.textContent = '(you)';
                row.appendChild(me);
            }
            memberPopover.appendChild(row);
        });
    }

    function openMemberPopover(anchor) {
        renderMemberPopover();
        memberPopover.classList.remove('hidden');
        memberPopoverOpen = true;
        // Below the element that was tapped, kept inside the room header
        const top = anchor.offsetTop + anchor.offsetHeight + 6;
        let left = anchor.offsetLeft;
        const maxLeft = roomHeader.clientWidth - memberPopover.offsetWidth - 8;
        if (left > maxLeft) left = Math.max(8, maxLeft);
        memberPopover.style.top = top + 'px';
        memberPopover.style.left = left + 'px';
    }

    function closeMemberPopover() {
        memberPopover.classList.add('hidden');
        memberPopoverOpen = false;
    }

    function toggleMemberPopover(anchor) {
        if (memberPopoverOpen) closeMemberPopover();
        else openMemberPopover(anchor);
    }

    memberCountBox.addEventListener('click', () => toggleMemberPopover(memberCountBox));

    // --- Rejoin the last room ---
    const LAST_ROOM_KEY = 'joshchat-last-room';

    function rememberRoom(roomId) {
        try { localStorage.setItem(LAST_ROOM_KEY, JSON.stringify({ roomId, at: Date.now() })); } catch (e) {}
    }

    function readLastRoom() {
        try {
            const raw = localStorage.getItem(LAST_ROOM_KEY);
            if (!raw) return null;
            const saved = JSON.parse(raw);
            if (!saved || typeof saved.roomId !== 'string' || typeof saved.at !== 'number') return null;
            if (Date.now() - saved.at > 7 * 24 * 60 * 60 * 1000) return null; // Far too old to still exist
            return saved.roomId;
        } catch (e) {
            return null;
        }
    }

    function forgetLastRoom() {
        try { localStorage.removeItem(LAST_ROOM_KEY); } catch (e) {}
        hideRejoinBanner();
    }

    function showRejoinBanner(roomId) {
        rejoinRoomId.textContent = roomId;
        rejoinBanner.classList.remove('hidden');
    }

    function hideRejoinBanner() {
        rejoinBanner.classList.add('hidden');
    }

    // Leaving on purpose (the Leave buttons) also drops the rejoin offer; closing the tab keeps it
    function leaveRoomByChoice() {
        forgetLastRoom();
        showHome();
    }

    rejoinBtn.addEventListener('click', () => {
        const roomId = rejoinRoomId.textContent.trim();
        if (!roomId) return;
        hideRejoinBanner();
        joinInput.value = roomId;
        joinBtn.click();
    });

    dismissRejoinBtn.addEventListener('click', forgetLastRoom);

    socket.on('room_check', (data) => {
        if (!data || typeof data.roomId !== 'string') return;
        if (!data.exists) {
            if (readLastRoom() === data.roomId) forgetLastRoom();
            if (pendingShare) showShareHint();
            return;
        }
        if (currentRoomId || !chatView.classList.contains('hidden')) return; // Already in a room
        if (pendingShare) {
            // Shared content goes straight back into the room it was most likely meant for
            joinInput.value = data.roomId;
            joinBtn.click();
            return;
        }
        showRejoinBanner(data.roomId);
    });

    // --- Content shared into the app from the Android share sheet (see sw.js) ---
    let pendingShare = null;

    async function loadSharedContent(id) {
        if (!('caches' in window) || !/^[a-z0-9]{1,40}$/i.test(id)) return null;
        try {
            const cache = await caches.open('joshchat-share-inbox');
            const metaRes = await cache.match(`/share-inbox/${id}/meta`);
            if (!metaRes) return null;
            const meta = await metaRes.json();
            let file = null;
            if (meta && meta.hasFile) {
                const fileRes = await cache.match(`/share-inbox/${id}/file`);
                if (fileRes) {
                    const blob = await fileRes.blob();
                    file = new File([blob], meta.name || 'shared-image', { type: meta.type || blob.type });
                }
            }
            await cache.delete(`/share-inbox/${id}/meta`);
            await cache.delete(`/share-inbox/${id}/file`);
            const text = [meta.title, meta.text, meta.url].filter((s) => typeof s === 'string' && s.trim()).join(' ').trim();
            if (!file && !text) return null;
            return { file, text };
        } catch (err) {
            console.warn('Could not read shared content:', err);
            return null;
        }
    }

    function showShareHint() {
        shareHint.classList.remove('hidden');
    }

    function applyPendingShare() {
        if (!pendingShare) return;
        const share = pendingShare;
        pendingShare = null;
        shareHint.classList.add('hidden');
        if (share.text) msgInput.value = share.text.substring(0, 3000);
        if (share.file) handleImageFile(share.file);
        else msgInput.focus();
    }

    // --- Server feedback ---
    socket.on('reaction_update', (data) => {
        if (!data || data.roomId !== currentRoomId) return;
        const entry = messagesById.get(data.messageId);
        if (!entry) return;
        entry.msg.reactions = normalizeReactions(data.reactions);
        if (Array.isArray(data.mine)) entry.msg.mine = data.mine.filter((e) => typeof e === 'string');
        renderReactions(entry.el, entry.msg);
        if (selectedMessageId === data.messageId) {
            msgToolbar.querySelectorAll('.toolbar-emoji').forEach((b) => b.classList.toggle('active', entry.msg.mine.includes(b.dataset.emoji)));
        }
    });

    socket.on('message_deleted', (data) => {
        if (!data || data.roomId !== currentRoomId) return;
        const entry = messagesById.get(data.messageId);
        if (!entry) return;
        entry.msg.deleted = true;
        entry.msg.message = '';
        entry.msg.image = null;
        entry.msg.imageOmitted = false;
        entry.msg.replyTo = null;
        entry.msg.reactions = {};
        entry.msg.mine = [];
        renderMessageBody(entry.el, entry.msg);
        if (selectedMessageId === data.messageId) clearSelection();
        if (pendingReply && pendingReply.id === data.messageId) clearPendingReply();
    });

    let lastRateWarning = 0;
    socket.on('rate_limited', (data) => {
        if (!data || (data.action !== 'chat_message' && data.action !== 'image')) return;
        if (Date.now() - lastRateWarning < 5000) return;
        lastRateWarning = Date.now();
        addSystemMessage(data.action === 'image'
            ? '⚠️ Too many images at once. Wait a moment before sending more.'
            : '⚠️ You are sending messages too fast. Wait a moment.');
    });

    socket.on('action_error', (data) => {
        if (data && typeof data.error === 'string') addSystemMessage('⚠️ ' + data.error);
    });

    // Connection Restoration Setup
    socket.on('connect', () => {
        const sysMessages = document.querySelectorAll('.system-message.reconnecting');
        sysMessages.forEach(msg => msg.remove());
        
        // Request nickname upon connection
        updateNickname(myNick || generateRandomNick());

        // FIX: If we were already in a room, silently rejoin on the server
        if (currentRoomId) {
            socket.emit('join_room', { roomId: currentRoomId });
        }
        console.log('Connected to server');
    });

    socket.on('disconnect', () => {
        if (currentRoomId && !document.querySelector('.system-message.reconnecting')) {
            addSystemMessage('Disconnected from server. Attempting to reconnect...');
            const lastMsg = messagesDiv.lastElementChild;
            if (lastMsg) lastMsg.classList.add('reconnecting');
        }
    });

    socket.on('connect_error', () => {
        if (currentRoomId && !document.querySelector('.system-message.reconnecting')) {
            addSystemMessage('Connection lost. Reconnecting...');
            const lastMsg = messagesDiv.lastElementChild;
            if (lastMsg) lastMsg.classList.add('reconnecting');
        }
    });

    // Handle Nickname Changes
    socket.on('nickname_changed', (data) => {
        if (!data || typeof data.newNick !== 'string') return;
        const oldNick = myNick;
        myNick = data.newNick;
        nickInput.value = myNick;
        
        if (data.reason === 'taken') {
            // Someone in the room already uses that name, so the server picked a variant
            addSystemMessage(`"${data.oldNick || oldNick}" is taken in this room, so you're now ${myNick}.`);
        } else if (oldNick && oldNick !== myNick) {
            // Notify the user if they actively changed it
            addSystemMessage(`Name updated to ${myNick}.`);
        }
    });

    // Handle Nickname Errors (Name already taken)
    socket.on('nickname_error', (data) => {
        addSystemMessage('⚠️ ' + data.error);
        // Revert the input box to the current valid nickname
        nickInput.value = myNick;
    });

    let unreadCount = 0;
    // Clear unread notifications when the tab/window becomes active
function clearUnreadNotifications() {
    unreadCount = 0;
    document.title = 'JoshChat';
}

    function clearUnreadDividers() {
    unreadChatCount = 0;
    
    // Remove the inline scrollable divider if it exists
    const divider = document.getElementById('unreadDivider');
    if (divider) divider.remove();
    
    // Hide the unread count badge on the floating button
    const scrollBadge = document.getElementById('scrollBadge');
    if (scrollBadge) {
        scrollBadge.classList.add('hidden');
        scrollBadge.innerText = "0";
    }
}

document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
        clearUnreadNotifications();
    }
});

window.addEventListener('focus', clearUnreadNotifications);
window.addEventListener('click', clearUnreadNotifications);
    
    socket.on('room_error', (data) => {
        forgetLastRoom();
        addSystemMessage('⚠️ ' + (data && data.error ? data.error : 'Room error.') + ' Returning home...');
        setTimeout(() => {
            showHome();
        }, 3000);
    });
    
    socket.on('new_message', (data) => {
        if (!data || data.roomId !== currentRoomId) return;
        const msg = normalizeMessage(data);
        if (msg.id && messagesById.has(msg.id)) return; // Already shown (can happen around a reconnect)
        if ((document.hidden || !document.hasFocus()) && !msg.own) {
            unreadCount++;
            document.title = `(${unreadCount}) JoshChat`;
        }
        // Their message arrived, so they are no longer "typing"
        if (typingUsers.has(msg.nick)) {
            clearTimeout(typingUsers.get(msg.nick));
            typingUsers.delete(msg.nick);
            renderTyping();
        }
        addMessage(msg);
    });

    // History comes from the server's buffer when entering a room, and again after a reconnect
    // to fill in anything missed while offline
    socket.on('history_response', (data) => {
        if (!data || data.roomId !== currentRoomId || !Array.isArray(data.history)) return;
        const fresh = [];
        data.history.forEach((raw) => {
            const msg = normalizeMessage(raw && typeof raw === 'object' ? raw : {});
            if (!msg.id) return;
            const known = messagesById.get(msg.id);
            if (known) {
                // Already shown: just bring its reactions up to date
                known.msg.reactions = msg.reactions;
                known.msg.mine = msg.mine;
                renderReactions(known.el, known.msg);
            } else {
                fresh.push(msg);
            }
        });
        if (!fresh.length) return;

        const shown = messagesDiv.querySelectorAll('.message[data-ts]');
        const lastShownTs = shown.length ? Number(shown[shown.length - 1].dataset.ts) : null;
        const older = [];
        const newer = [];
        fresh.forEach((msg) => {
            if (lastShownTs !== null && msg.timestamp >= lastShownTs) newer.push(msg);
            else older.push(msg);
        });

        if (older.length) {
            // Render history by prepending, so live messages that already arrived keep their place
            const fragment = document.createDocumentFragment();
            older.forEach((msg) => fragment.appendChild(buildMessageElement(msg)));
            stickToBottomOnImageLoad(fragment);
            messagesDiv.insertBefore(fragment, messagesDiv.firstChild);
        }
        newer.forEach((msg) => addMessage(msg)); // Missed while disconnected: shown like live messages
        rebuildDateSeparators();
        if (older.length && !newer.length) messagesDiv.scrollTop = messagesDiv.scrollHeight;
    });
    
    socket.on('room_notification', (notif) => {
        if (notif.roomId === currentRoomId) {
            addSystemMessage(notif.text);
        }
    });

    socket.on('member_count', (data) => {
        if (memberCountDisplay) {
            memberCountDisplay.innerText = data.count;
        }
        if (memberCountBarDisplay) {
            memberCountBarDisplay.innerText = data.count;
        }
    });
    
    socket.on('room_created', (data) => {
        setCreateRoomLoading(false);
        showChat(data.roomId, true);
    });
    
socket.on('join_result', (data) => {
        setJoinRoomLoading(false);
        if (!data) return;
        if (data.success) {
            // FIX: If we are already looking at the room, just silently reconnect without wiping history
            if (currentRoomId === data.roomId && !chatView.classList.contains('hidden')) {
                addSystemMessage('Connection restored. Rejoined chat.');
                socket.emit('request_history', { roomId: data.roomId }); // Fill in anything missed while offline
            } else {
                showChat(data.roomId);
            }
        } else {
            if (data.roomId && readLastRoom() === data.roomId) forgetLastRoom(); // No point offering it again
            // FIX: If room expired on the server while you were away, go back home gracefully
            if (currentRoomId && currentRoomId === data.roomId) {
                addSystemMessage('⚠️ Room session expired while you were away.');
                setTimeout(() => showHome(), 2500);
            } else {
                joinError.innerText = data.error || 'Room does not exist';
                joinError.classList.remove('hidden');
                setTimeout(() => joinError.classList.add('hidden'), 3000);
            }
        }
    });
    
    makeBtn.addEventListener('click', () => {
        setCreateRoomLoading(true);
        socket.emit('create_room');
    });
    
    joinBtn.addEventListener('click', () => {
        const rid = joinInput.value.trim().toUpperCase();
        if (!rid) {
            joinError.innerText = 'Enter an ID';
            joinError.classList.remove('hidden');
            setTimeout(() => joinError.classList.add('hidden'), 2000);
            return;
        }
        setJoinRoomLoading(true);
        socket.emit('join_room', { roomId: rid });
    });
    
    sendBtn.addEventListener('click', sendMessage);
    // On touch devices a tap on Send would blur the input (closing the keyboard) only for
    // sendMessage() to focus it again: keep the focus where it is so the keyboard stays put
    sendBtn.addEventListener('mousedown', (e) => e.preventDefault());
    msgInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) sendMessage(); }); // keydown: mobile keyboards don't reliably fire keypress
    leaveBtn.addEventListener('click', leaveRoomByChoice);
    joinInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.isComposing) {
        joinBtn.click();
        }
    });
    
    copyRoomBtn.addEventListener('click', () => {
        if (currentRoomId) {
            navigator.clipboard.writeText(currentRoomId);
            const originalText = copyRoomBtn.innerHTML;
            copyRoomBtn.innerHTML = '<i class="ph ph-check"></i> Copied';
            setTimeout(() => {
                copyRoomBtn.innerHTML = originalText;
            }, 2000);
        }
    });
    
    updateNickBtn.addEventListener('click', () => updateNickname(nickInput.value));
    nickInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) updateNickname(nickInput.value); });

    const urlParams = new URLSearchParams(window.location.search);
    const roomFromUrl = urlParams.get('room');
    const sharedId = urlParams.get('shared');
    if (roomFromUrl || sharedId) {
        window.history.replaceState({}, document.title, window.location.pathname);
    }
    if (roomFromUrl) {
        joinInput.value = roomFromUrl.toUpperCase();
        setTimeout(() => joinBtn.click(), 500);
    }

    // Shared content (Android share sheet) and the offer to rejoin the last room
    const lastRoomId = readLastRoom();
    (async () => {
        if (sharedId) pendingShare = await loadSharedContent(sharedId);
        if (roomFromUrl) return; // The link decides the room; any shared content is applied on entry
        if (lastRoomId) {
            socket.emit('check_room', { roomId: lastRoomId }); // Queued until the connection is up
        } else if (pendingShare) {
            showShareHint();
        }
    })();

    // The service worker only receives content from the share sheet (see sw.js); nothing is cached
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
</script>
