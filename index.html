<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>JoshChat</title>
    
    <!-- QR Code library -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src"script.js" defer></script>
    <!-- Socket.io -->
    <script src="/socket.io/socket.io.js"></script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%230a2b3e'/><text x='50' y='50' fill='white' font-family='sans-serif' font-weight='bold' font-size='50' text-anchor='middle' dominant-baseline='central'>JC</text></svg>">
</head>
<body class="dark">
<div class="app-container">
    <div class="header">
        <h1><i class="ph ph-broadcast"></i> JoshChat</h1>
        
        <label class="theme-switch" for="themeToggle">
            <input type="checkbox" id="themeToggle" />
            <div class="slider">
                <i class="ph ph-sun"></i>
                <i class="ph ph-moon"></i>
                <div class="knob"></div>
            </div>
        </label>
    </div>

    <div class="main-content">
        <!-- Home View -->
        <div id="homeView">
            <div class="home-panel">
                <button class="btn btn-primary" id="makeRoomBtn">
                    <span id="makeBtnText">Create Room</span>
                    <span id="makeBtnSpinner" class="spinner" style="display: none;"></span>
                </button>
                <div class="join-area">
                    <label>Join a room</label>
                    <div class="join-row">
                        <input type="text" id="joinRoomIdInput" placeholder="Room Code" autocomplete="off">
                        <button class="btn" id="joinRoomBtn">
                            <span id="joinBtnText">Join</span>
                            <span id="joinBtnSpinner" class="spinner" style="display: none;"></span>
                        </button>
                    </div>
                    <div id="joinErrorMsg" class="error-message hidden"></div>
                </div>
            </div>
        </div>

        <!-- Chat View -->
        <div id="chatView" class="hidden">
            <div class="room-header">
                <div class="room-id-box">
                    <span>ID: <strong id="roomIdDisplay">---</strong></span>
                    <button class="copy-btn" id="copyRoomIdBtn"><i class="ph ph-copy"></i> Copy</button>
                </div>
                <div class="qr-container" id="qrContainer"></div>
                
                <!-- NEW: Member count & Nick section combined -->
                <div class="room-actions-row">
                    <div class="member-count-box" title="Users in room">
                        <i class="ph ph-users"></i>
                        <span id="memberCountDisplay">1</span>
                    </div>
                    <div class="nick-section">
                        <input type="text" id="nicknameInput" placeholder="Name" maxlength="20">
                        <button id="updateNickBtn">Set</button>
                    </div>
                </div>
            </div>
            
            <div class="messages-area" id="messagesContainer">
                <!-- Messages will appear here -->
            </div>
            
            <div class="chat-input-area">
                <input type="text" id="messageInput" placeholder="Message..." autocomplete="off">
                <button id="sendMsgBtn">Send</button>
            </div>
            
            <button class="leave-btn" id="leaveRoomBtn"><i class="ph ph-sign-out"></i> Leave Room</button>
        </div>
    </div>
    <footer>Made by Josh Pirvu</footer>
</div>

</body>
</html>
