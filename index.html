<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>LinkDrop · fast link transfer</title>
    <!-- QR Code library -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        /* Light theme */
        :root {
            --bg-gradient-start: #f6f9fc;
            --bg-gradient-end: #eef2f5;
            --container-bg: rgba(255, 255, 255, 0.96);
            --header-bg: #0a2b3e;
            --header-text: white;
            --card-bg: #ffffff;
            --card-border: #e2e8f0;
            --btn-primary-bg: #0f2f3d;
            --btn-primary-hover: #1a4458;
            --btn-outline-border: #bdd3e0;
            --btn-outline-text: #1f2f3e;
            --btn-outline-hover-bg: #eef4f9;
            --join-area-bg: #f8fafc;
            --input-border: #cbdde6;
            --input-focus-ring: rgba(15, 47, 61, 0.1);
            --message-bg: #f0f4f8;
            --message-own-bg: #d9eefb;
            --message-name: #1c6d8f;
            --message-text: #1e2a3a;
            --system-message-bg: #eff3f6;
            --system-message-text: #2c5a6e;
            --chat-input-bg: #ffffff;
            --chat-input-border: #dce5ec;
            --leave-btn-bg: #dce5ec;
            --leave-btn-text: #2c5a6e;
            --footer-text: #6d8c9b;
            --error-bg: #fff0f0;
            --error-text: #d14545;
            --room-id-box-bg: #ffffffcc;
            --nick-section-bg: white;
        }

        /* Dark theme - improved contrast */
        body.dark {
            --bg-gradient-start: #0f1722;
            --bg-gradient-end: #0a0f18;
            --container-bg: #1a2332;
            --header-bg: #07111c;
            --header-text: #f1f5f9;
            --card-bg: #1f2a3e;
            --card-border: #2d3a4e;
            --btn-primary-bg: #2c5f8a;
            --btn-primary-hover: #3f7bae;
            --btn-outline-border: #3e4a66;
            --btn-outline-text: #e2e8f0;
            --btn-outline-hover-bg: #2a354b;
            --join-area-bg: #121a2a;
            --input-border: #3e4d6b;
            --input-focus-ring: rgba(56, 132, 255, 0.4);
            --message-bg: #2a354d;
            --message-own-bg: #1f4a6e;
            --message-name: #aac9ff;
            --message-text: #f0f4fe;
            --system-message-bg: #1e2a3a;
            --system-message-text: #cbd5e6;
            --chat-input-bg: #1f2a3e;
            --chat-input-border: #3e4d6b;
            --leave-btn-bg: #2a354b;
            --leave-btn-text: #e2e8f0;
            --footer-text: #94a3b8;
            --error-bg: #3b2a2a;
            --error-text: #ffb3b3;
            --room-id-box-bg: #111a2ecc;
            --nick-section-bg: #111a2a;
        }

        body {
            background: linear-gradient(145deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0.8rem;
        }

        .app-container {
            max-width: 700px;
            width: 100%;
            background: var(--container-bg);
            border-radius: 2rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .header {
            background: var(--header-bg);
            padding: 1rem 1.5rem;
            color: var(--header-text);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header h1 span {
            background: #ffcd3c;
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 30px;
            color: #0a2b3e;
        }

        .theme-toggle {
            background: rgba(255,255,255,0.15);
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            border-radius: 40px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .theme-toggle:hover {
            background: rgba(255,255,255,0.3);
        }

        .main-content {
            padding: 1.2rem;
        }

        .btn {
            border: none;
            background: var(--card-bg);
            padding: 0.9rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 3rem;
            cursor: pointer;
            border: 1px solid var(--card-border);
            color: var(--btn-outline-text);
            transition: 0.2s;
            width: 100%;
        }
        .btn-primary {
            background: var(--btn-primary-bg);
            color: white;
            border: none;
        }
        .btn-primary:active {
            transform: scale(0.97);
        }
        .join-area {
            background: var(--join-area-bg);
            border-radius: 1.5rem;
            padding: 1.2rem;
            margin-top: 1rem;
        }
        .join-area label {
            color: var(--btn-outline-text);
            font-weight: 500;
            display: block;
            margin-bottom: 0.5rem;
        }
        .join-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .join-row input {
            flex: 1;
            padding: 0.9rem;
            border-radius: 3rem;
            border: 1px solid var(--input-border);
            background: var(--card-bg);
            color: var(--btn-outline-text);
            font-size: 1rem;
            outline: none;
        }
        .join-row input:focus {
            border-color: var(--btn-primary-bg);
            box-shadow: 0 0 0 3px var(--input-focus-ring);
        }
        .room-header {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: var(--join-area-bg);
            padding: 1rem;
            border-radius: 1.5rem;
            margin-bottom: 1rem;
        }
        .room-id-box {
            background: var(--room-id-box-bg);
            padding: 0.6rem 1rem;
            border-radius: 3rem;
            font-family: monospace;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            backdrop-filter: blur(4px);
            color: var(--btn-outline-text);
        }
        .copy-btn {
            background: none;
            border: none;
            font-size: 1rem;
            font-weight: normal;
            cursor: pointer;
            color: var(--btn-outline-text);
            padding: 0.2rem 0.8rem;
            border-radius: 2rem;
            background: rgba(255,255,255,0.1);
        }
        .qr-container {
            display: flex;
            justify-content: center;
            margin: 10px 0;
        }
        .nick-section {
            display: flex;
            gap: 8px;
            align-items: center;
            background: var(--nick-section-bg);
            padding: 0.4rem 0.8rem;
            border-radius: 3rem;
            border: 1px solid var(--card-border);
        }
        .nick-section input {
            background: transparent;
            border: none;
            padding: 0.4rem 0;
            width: 110px;
            font-size: 0.85rem;
            outline: none;
            color: var(--btn-outline-text);
        }
        .nick-section button {
            background: var(--btn-primary-bg);
            border: none;
            padding: 0.2rem 0.8rem;
            border-radius: 2rem;
            color: white;
            font-size: 0.7rem;
            cursor: pointer;
        }
        .messages-area {
            background: var(--card-bg);
            border-radius: 1.5rem;
            border: 1px solid var(--card-border);
            height: 55vh;
            overflow-y: auto;
            padding: 0.8rem;
            margin: 1rem 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .message {
            max-width: 85%;
            padding: 0.6rem 1rem;
            border-radius: 1.5rem;
            background: var(--message-bg);
            align-self: flex-start;
            word-break: break-word;
            color: var(--message-text);
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        .message.own {
            background: var(--message-own-bg);
            align-self: flex-end;
            color: var(--message-text);
        }
        .message .msg-name {
            font-weight: 700;
            font-size: 0.7rem;
            color: var(--message-name);
            margin-bottom: 4px;
            display: block;
        }
        .chat-input-area {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .chat-input-area input {
            flex: 2;
            padding: 0.9rem;
            border-radius: 3rem;
            border: 1px solid var(--input-border);
            background: var(--card-bg);
            color: var(--btn-outline-text);
            font-size: 1rem;
            outline: none;
        }
        .chat-input-area input:focus {
            border-color: var(--btn-primary-bg);
        }
        .chat-input-area button {
            background: var(--btn-primary-bg);
            border: none;
            padding: 0 1.2rem;
            border-radius: 3rem;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .chat-input-area button:active {
            transform: scale(0.96);
        }
        .leave-btn {
            background: var(--leave-btn-bg);
            color: var(--leave-btn-text);
            width: 100%;
            margin-top: 0.8rem;
            border: none;
            padding: 0.8rem;
            border-radius: 3rem;
            font-weight: 600;
            cursor: pointer;
        }
        .system-message {
            text-align: center;
            font-size: 0.7rem;
            background: var(--system-message-bg);
            padding: 0.3rem 0.8rem;
            border-radius: 2rem;
            width: fit-content;
            margin: 0 auto;
            color: var(--system-message-text);
        }
        .error-message {
            background: var(--error-bg);
            color: var(--error-text);
            padding: 0.6rem 1rem;
            border-radius: 2rem;
            font-size: 0.85rem;
            text-align: center;
            margin-top: 1rem;
            font-weight: 500;
        }
        .hidden { display: none; }
        footer {
            text-align: center;
            font-size: 0.7rem;
            padding: 0.8rem;
            color: var(--footer-text);
            border-top: 1px solid var(--card-border);
        }
        @media (max-width: 480px) {
            .main-content { padding: 0.8rem; }
            .btn, .join-row input, .chat-input-area input { font-size: 1rem; padding: 0.8rem; }
        }
    </style>
    <script src="/socket.io/socket.io.js"></script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📡</text></svg>">
</head>
<body class="dark">
<div class="app-container">
    <div class="header">
        <h1>📡 LinkDrop <span>fast link</span></h1>
        <button class="theme-toggle" id="themeToggleBtn">☀️</button>
    </div>
    <div class="main-content">
        <div id="homeView">
            <div class="home-panel">
                <button class="btn btn-primary" id="makeRoomBtn">✨ Create room</button>
                <div class="join-area">
                    <label>🔗 Or join an existing room</label>
                    <div class="join-row">
                        <input type="text" id="joinRoomIdInput" placeholder="Ex: A1B2C3" autocomplete="off">
                        <button class="btn" id="joinRoomBtn">Join</button>
                    </div>
                    <div id="joinErrorMsg" class="error-message hidden"></div>
                </div>
            </div>
        </div>
        <div id="chatView" class="hidden">
            <div class="room-header">
                <div class="room-id-box">
                    <span>🆔 <strong id="roomIdDisplay">---</strong></span>
                    <button class="copy-btn" id="copyRoomIdBtn">📋 Copy ID</button>
                </div>
                <div class="qr-container" id="qrContainer"></div>
                <div class="nick-section">
                    <input type="text" id="nicknameInput" placeholder="Name" maxlength="20">
                    <button id="updateNickBtn">Set</button>
                </div>
            </div>
            <div class="messages-area" id="messagesContainer">
                <div class="system-message">✨ Connected. Send any link.</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="messageInput" placeholder="Type a link or message...">
                <button id="sendMsgBtn">Send</button>
            </div>
            <button class="leave-btn" id="leaveRoomBtn">🚪 Leave room</button>
        </div>
    </div>
    <footer>🔐 No account · Scan QR for direct link · Made By Josh Pirvu</footer>
</div>
<script>
    // Theme dark/light
    const themeToggle = document.getElementById('themeToggleBtn');
    function setTheme(theme) {
        if (theme === 'dark') {
            document.body.classList.add('dark');
            localStorage.setItem('linkdrop-theme', 'dark');
            themeToggle.innerHTML = '☀️';
        } else {
            document.body.classList.remove('dark');
            localStorage.setItem('linkdrop-theme', 'light');
            themeToggle.innerHTML = '🌙';
        }
    }
    const savedTheme = localStorage.getItem('linkdrop-theme');
    if (savedTheme === 'light') setTheme('light');
    else setTheme('dark');
    themeToggle.addEventListener('click', () => {
        const isDark = document.body.classList.contains('dark');
        setTheme(isDark ? 'light' : 'dark');
    });

    // --- Socket.io with backend URL (Render) or local if same server ---
    const SOCKET_URL = 'https://linkdrop-server-k92j.onrender.com';
    const socket = io(SOCKET_URL);

    let currentRoomId = null;
    let myNick = '';

    // DOM elements
    const homeView = document.getElementById('homeView');
    const chatView = document.getElementById('chatView');
    const makeBtn = document.getElementById('makeRoomBtn');
    const joinBtn = document.getElementById('joinRoomBtn');
    const joinInput = document.getElementById('joinRoomIdInput');
    const joinError = document.getElementById('joinErrorMsg');
    const roomIdSpan = document.getElementById('roomIdDisplay');
    const copyRoomBtn = document.getElementById('copyRoomIdBtn');
    const messagesDiv = document.getElementById('messagesContainer');
    const msgInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendMsgBtn');
    const leaveBtn = document.getElementById('leaveRoomBtn');
    const nickInput = document.getElementById('nicknameInput');
    const updateNickBtn = document.getElementById('updateNickBtn');
    const qrContainer = document.getElementById('qrContainer');

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function addMessage(name, text, isOwn = false) {
        const div = document.createElement('div');
        div.className = 'message' + (isOwn ? ' own' : '');
        div.innerHTML = `<span class="msg-name">${escapeHtml(isOwn ? 'You' : name)}</span><div>${escapeHtml(text)}</div>`;
        messagesDiv.appendChild(div);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function addSystemMessage(text) {
        const sys = document.createElement('div');
        sys.className = 'system-message';
        sys.innerText = text;
        messagesDiv.appendChild(sys);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function clearMessages() { messagesDiv.innerHTML = ''; }

    function showHome() {
        homeView.classList.remove('hidden');
        chatView.classList.add('hidden');
        if (currentRoomId) socket.emit('leave_room', { roomId: currentRoomId });
        currentRoomId = null;
        clearMessages();
        joinError.classList.add('hidden');
        qrContainer.innerHTML = '';
    }

    function showChat(roomId) {
        homeView.classList.add('hidden');
        chatView.classList.remove('hidden');
        currentRoomId = roomId;
        roomIdSpan.innerText = roomId;
        clearMessages();
        addSystemMessage(`📡 In room: ${roomId}`);
        msgInput.focus();
        const directLink = `${window.location.origin}?room=${roomId}`;
        addSystemMessage(`🔗 Direct link: ${directLink}`);
        qrContainer.innerHTML = '';
        try {
            new QRCode(qrContainer, {
                text: directLink,
                width: 120,
                height: 120
            });
            addSystemMessage(`📱 Scan the QR code to quickly join from another device.`);
        } catch(e) { console.warn("QR error", e); }
    }

    function generateRandomNick() {
        const names = ["Pixel", "Wave", "Echo", "Nova", "Luma", "Zest"];
        return names[Math.floor(Math.random()*names.length)] + Math.floor(Math.random()*900+100);
    }

    function updateNickname(nick) {
        if (!nick || !nick.trim()) nick = generateRandomNick();
        myNick = nick.trim().substring(0,20);
        socket.emit('set_nickname', { nick: myNick });
        nickInput.value = myNick;
    }

    function sendMessage() {
        const text = msgInput.value.trim();
        if (!text || !currentRoomId) return;
        socket.emit('chat_message', { roomId: currentRoomId, message: text });
        msgInput.value = '';
        msgInput.focus();
    }

    // Socket events
    socket.on('connect', () => {
        updateNickname(myNick || generateRandomNick());
        addSystemMessage('✅ Connected to server');
    });
    socket.on('new_message', (data) => {
        if (data.roomId === currentRoomId) {
            addMessage(data.nick, data.message, data.nick === myNick);
        }
    });
    socket.on('room_notification', (notif) => {
        if (notif.roomId === currentRoomId) addSystemMessage(notif.text);
    });
    socket.on('room_created', (data) => {
        showChat(data.roomId);
        addSystemMessage(`🌟 Room created! ID: ${data.roomId}`);
    });
    socket.on('join_result', (data) => {
        if (data.success) {
            showChat(data.roomId);
            addSystemMessage(`✅ You joined room ${data.roomId}`);
        } else {
            joinError.innerText = data.error || 'Room does not exist';
            joinError.classList.remove('hidden');
            setTimeout(() => joinError.classList.add('hidden'), 3000);
        }
    });
    socket.on('nickname_changed', (data) => {
        if (data.newNick === myNick) addSystemMessage(`🟢 Name set: ${myNick}`);
    });
    socket.on('disconnect', () => addSystemMessage('🔌 Disconnected from server'));

    // UI Listeners
    makeBtn.addEventListener('click', () => socket.emit('create_room'));
    joinBtn.addEventListener('click', () => {
        const rid = joinInput.value.trim().toUpperCase();
        if (!rid) { joinError.innerText = 'Enter an ID'; joinError.classList.remove('hidden'); setTimeout(() => joinError.classList.add('hidden'),2000); return; }
        socket.emit('join_room', { roomId: rid });
    });
    sendBtn.addEventListener('click', sendMessage);
    msgInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
    leaveBtn.addEventListener('click', showHome);
    copyRoomBtn.addEventListener('click', () => {
        if (currentRoomId) {
            navigator.clipboard.writeText(currentRoomId);
            addSystemMessage('📋 ID copied');
        }
    });
    updateNickBtn.addEventListener('click', () => updateNickname(nickInput.value));
    nickInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') updateNickname(nickInput.value); });

    // Auto-join via URL parameter
    const urlParams = new URLSearchParams(window.location.search);
    const roomFromUrl = urlParams.get('room');
    if (roomFromUrl) {
        joinInput.value = roomFromUrl.toUpperCase();
        setTimeout(() => joinBtn.click(), 500);
        window.history.replaceState({}, document.title, window.location.pathname);
    }
    updateNickname(generateRandomNick());
</script>
</body>
</html>
